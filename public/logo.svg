<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="55%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- Background rounded badge -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-opacity="0.45" />

  <!-- Soft outer ring -->
  <circle cx="256" cy="256" r="158" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-opacity="0.35" />

  <!-- Stylized Church Dome & Coptic Cross -->
  <g fill="url(#goldGrad)">
    <!-- Vertical beam -->
    <rect x="236" y="108" width="40" height="296" rx="14" />
    <!-- Horizontal beam -->
    <rect x="132" y="196" width="248" height="40" rx="14" />
    <!-- Flared Coptic tips -->
    <circle cx="256" cy="108" r="18" />
    <circle cx="256" cy="404" r="18" />
    <circle cx="132" cy="216" r="18" />
    <circle cx="380" cy="216" r="18" />
  </g>

  <!-- Inner highlight cross -->
  <g fill="#ffffff" fill-opacity="0.92">
    <rect x="246" y="128" width="20" height="256" rx="8" />
    <rect x="152" y="206" width="208" height="20" rx="8" />
  </g>

  <!-- Center medallion -->
  <circle cx="256" cy="216" r="22" fill="#1e1b4b" stroke="url(#goldGrad)" stroke-width="6" />
  <circle cx="256" cy="216" r="7" fill="#fde68a" />
</svg>
